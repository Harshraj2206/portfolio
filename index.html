<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harsh Raj - CSE (AI & ML) Student Portfolio</title>
    <meta name="description" content="Portfolio of Harsh Raj, a 2nd-year CSE (AI & ML) student at Jain University Global Campus. Projects: LandSafe and NammaRoute." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harssshraj-portfolio.vercel.app/" />
    <meta property="og:title" content="Harsh Raj - CSE (AI & ML) Student Portfolio" />
    <meta property="og:description" content="Portfolio of Harsh Raj, a 2nd-year CSE (AI & ML) student at Jain University Global Campus. Projects: LandSafe and NammaRoute." />
    <meta property="og:image" content="https://harssshraj-portfolio.vercel.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harsh Raj - CSE (AI & ML) Student Portfolio" />
    <meta name="twitter:description" content="Portfolio of Harsh Raj, a 2nd-year CSE (AI & ML) student at Jain University Global Campus. Projects: LandSafe and NammaRoute." />
    <meta name="twitter:image" content="https://harssshraj-portfolio.vercel.app/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://harssshraj-portfolio.vercel.app/" />
    <script>
      // Preload the hero portrait only on the home page, the only page that uses it
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/png'; l.crossOrigin = 'anonymous';
        l.href = '/images/harsh-raj.png';
        document.head.appendChild(l);
      }
    </script>
    <meta name="theme-color" content="#050505" />

    <!-- JSON-LD Structured Data for Person Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Harsh Raj",
      "jobTitle": "CSE (AI & ML) Student",
      "description": "Portfolio of Harsh Raj, a 2nd-year CSE (AI & ML) student at Jain University Global Campus. Projects: LandSafe and NammaRoute.",
      "url": "https://harssshraj-portfolio.vercel.app",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Jain University Global Campus"
      },
      "knowsAbout": ["Python", "Java", "HTML", "CSS", "C", "Advanced Python", "Prompt engineering", "Artificial Intelligence", "Machine Learning"]
    }
    </script>
  </head>
  <body>
    <!-- Critical inline CSS for instant zero-delay first paint -->
    <style>
      html, body {
        background-color: #050505;
        margin: 0;
        padding: 0;
      }
      #initial-intro-vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(14, 14, 16, 0.96) 0%, rgba(5, 5, 5, 1) 100%);
        pointer-events: none;
        z-index: 10;
        transition: opacity 0.2s ease-out;
      }
      #initial-intro-dot {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        border-radius: 9999px;
        background-color: #ffffff;
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 0 32px rgba(255, 255, 255, 0.5);
        transform: translate(-50%, -36dvh);
        pointer-events: none;
        z-index: 35;
        transition: opacity 0.1s ease-out;
      }
    </style>

    <!-- Accessible Skip Link -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-6 focus:py-3 focus:bg-white focus:text-black focus:rounded-pill focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-white">
      Skip to main content
    </a>
    
    <!-- Inline Critical Vignette & Dot for Zero-Delay First Paint -->
    <div id="initial-intro-vignette" aria-hidden="true"></div>
    <div id="initial-intro-dot" aria-hidden="true"></div>
    <script>
      // The intro dot only belongs to the home page intro
      if (location.pathname !== '/') {
        document.getElementById('initial-intro-dot').remove();
        document.getElementById('initial-intro-vignette').remove();
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
